<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin - E-Absensi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    if (localStorage.getItem("isLoggedIn") !== "true" || !localStorage.getItem("sessionToken")) {
      window.location.replace("login.html");
    }
  </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- NAVBAR -->
  <header class="bg-slate-800 border-b border-slate-700 px-4 sm:px-6 py-4 flex justify-between items-center sticky top-0 z-40">
    <div class="flex items-center space-x-2 sm:space-x-3">
      <span class="text-xl sm:text-2xl">📊</span>
      <h1 class="font-bold text-base sm:text-lg text-white">DASHBOARD <span class="text-emerald-400">ADMIN</span></h1>
    </div>

    <div class="flex items-center space-x-2 sm:space-x-4">
      <a href="index.html" class="text-xs text-slate-400 hover:text-white transition">📷 Scanner</a>
      <button onclick="logout()" class="bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 px-2.5 py-1.5 rounded-xl text-xs font-semibold transition">
        🚪 Logout
      </button>
    </div>
  </header>

  <!-- CONTENT -->
  <main class="max-w-6xl mx-auto px-3 sm:px-6 py-6 flex-1 w-full space-y-6">

    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      <div>
        <h2 class="text-xl sm:text-2xl font-bold text-white">Ringkasan Absensi</h2>
        <p class="text-xs text-slate-400">Kelola dan pantau data kehadiran siswa real-time</p>
      </div>
      <button onclick="loadDashboardData()" class="self-start sm:self-auto bg-slate-800 hover:bg-slate-700 border border-slate-600 px-3 py-1.5 rounded-xl text-xs font-medium transition flex items-center gap-2">
        🔄 Refresh Data
      </button>
    </div>

    <!-- CARDS STATISTIK (2 Kolom di HP, 6 Kolom di Desktop) -->
    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2.5 sm:gap-4">
      <div class="bg-slate-800/90 border border-slate-700 p-3 sm:p-4 rounded-2xl">
        <p class="text-[10px] sm:text-xs text-slate-400 font-medium">Total Absen</p>
        <h3 id="stat-total" class="text-xl sm:text-2xl font-bold text-white mt-1">0</h3>
      </div>
      <div class="bg-slate-800/90 border border-emerald-500/30 p-3 sm:p-4 rounded-2xl bg-emerald-500/5">
        <p class="text-[10px] sm:text-xs text-emerald-400 font-medium">Hadir</p>
        <h3 id="stat-hadir" class="text-xl sm:text-2xl font-bold text-emerald-400 mt-1">0</h3>
      </div>
      <div class="bg-slate-800/90 border border-amber-500/30 p-3 sm:p-4 rounded-2xl bg-amber-500/5">
        <p class="text-[10px] sm:text-xs text-amber-400 font-medium">Terlambat</p>
        <h3 id="stat-terlambat" class="text-xl sm:text-2xl font-bold text-amber-400 mt-1">0</h3>
      </div>
      <div class="bg-slate-800/90 border border-blue-500/30 p-3 sm:p-4 rounded-2xl bg-blue-500/5">
        <p class="text-[10px] sm:text-xs text-blue-400 font-medium">Sakit</p>
        <h3 id="stat-sakit" class="text-xl sm:text-2xl font-bold text-blue-400 mt-1">0</h3>
      </div>
      <div class="bg-slate-800/90 border border-purple-500/30 p-3 sm:p-4 rounded-2xl bg-purple-500/5">
        <p class="text-[10px] sm:text-xs text-purple-400 font-medium">Izin</p>
        <h3 id="stat-izin" class="text-xl sm:text-2xl font-bold text-purple-400 mt-1">0</h3>
      </div>
      <div class="bg-slate-800/90 border border-rose-500/30 p-3 sm:p-4 rounded-2xl bg-rose-500/5">
        <p class="text-[10px] sm:text-xs text-rose-400 font-medium">Alpa</p>
        <h3 id="stat-alpa" class="text-xl sm:text-2xl font-bold text-rose-400 mt-1">0</h3>
      </div>
    </div>

    <!-- TABEL REKAP ABSENSI SISWA -->
    <div class="bg-slate-800 rounded-2xl border border-slate-700 overflow-hidden shadow-xl">
      <div class="p-4 border-b border-slate-700 flex justify-between items-center">
        <h3 class="font-bold text-sm sm:text-base text-white">📋 Data Rekap Harian</h3>
        <span class="text-xs text-slate-400">Geser tabel untuk selengkapnya $\rightarrow$</span>
      </div>

      <!-- Container Scroll Horizontal untuk Mobile -->
      <div class="overflow-x-auto w-full">
        <table class="w-full text-left text-xs sm:text-sm text-slate-300">
          <thead class="bg-slate-900/80 text-slate-400 uppercase text-[10px] sm:text-xs tracking-wider">
            <tr>
              <th class="px-4 py-3">Waktu / Tgl</th>
              <th class="px-4 py-3">NISN & Nama</th>
              <th class="px-4 py-3">Status</th>
              <th class="px-4 py-3">Keterangan</th>
              <th class="px-4 py-3 text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="tabel-rekap-body" class="divide-y divide-slate-700/50">
            <tr>
              <td colspan="5" class="text-center py-6 text-slate-500">Memuat data...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script src="dashboard.js"></script>
</body>
</html>
